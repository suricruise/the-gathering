# Lightweight local integration-test stack. Not a production deployment.
# Uses real official Auth, PostgREST, and Storage with PostgreSQL 17.
services:
  db:
    image: postgres:17-alpine
    ports: ["127.0.0.1:54322:5432"]
    environment:
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
    volumes: ["test-db:/var/lib/postgresql/data"]
  mail:
    image: ghcr.io/supabase/mailpit:v1.31.3
    ports: ["127.0.0.1:54324:8025"]
  auth:
    image: ghcr.io/supabase/gotrue:v2.197.0
    ports: ["127.0.0.1:54325:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${TEST_DB_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:4173
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:4173/**,http://127.0.0.1:3000/**
      GOTRUE_JWT_SECRET: ${TEST_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: community@example.test
      GOTRUE_SMTP_SENDER_NAME: The Gathering Local Test
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
  rest:
    image: ghcr.io/supabase/postgrest:v16.4
    ports: ["127.0.0.1:54326:3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:${TEST_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${TEST_JWT_SECRET}
      PGRST_DB_MAX_ROWS: 1000
  storage:
    image: ghcr.io/supabase/storage-api:v1.82.1
    ports: ["127.0.0.1:54327:5000"]
    environment:
      ANON_KEY: ${TEST_ANON_KEY}
      SERVICE_KEY: ${TEST_SERVICE_KEY}
      AUTH_JWT_SECRET: ${TEST_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${TEST_DB_PASSWORD}@db:5432/postgres
      POSTGREST_URL: http://rest:3000
      STORAGE_PUBLIC_URL: http://127.0.0.1:54321
      FILE_SIZE_LIMIT: 2097152
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: gathering-test
      REGION: local
      GLOBAL_S3_BUCKET: gathering-test
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes: ["test-storage:/var/lib/storage"]
volumes:
  test-db:
  test-storage:
